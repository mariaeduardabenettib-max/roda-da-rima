function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const catById = id => CATS.find(c=>c.id===id);
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const isUuid = s => /^[0-9a-f-]{36}$/i.test(String(s||''));

/* ---------- Supabase ---------- */
const SB_OK = /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length>30 && !!window.supabase;
const sb = SB_OK ? window.supabase.createClient(SUPABASE_URL.replace(/\/$/,''), SUPABASE_ANON_KEY) : null;
const AUTH = {uid:null, user:null, perfil:null};
const isAdmin = () => !!(AUTH.perfil && AUTH.perfil.papel==='admin');
let CFG = {vidas:3, tempo:20, tempo_impossivel:25, medidor:3, impossivel_enche:true};
const DATA = {perguntas:null};

function fromRow(r){return {id:r.id,cat:r.categoria,q:r.pergunta,c:r.certa,w:[r.errada1,r.errada2,r.errada3],ex:r.explicacao||'',key:r.id}}
function allQuestions(){
  if(DATA.perguntas&&DATA.perguntas.length) return DATA.perguntas;
  return Q.map((q,i)=>({cat:q[0],q:q[1],c:q[2],w:q[3],ex:q[4],id:'b'+i,key:'b'+i}));
}
async function carregarPerguntas(){
  if(!sb) return;
  const {data,error}=await sb.from('perguntas').select('id,categoria,pergunta,certa,errada1,errada2,errada3,explicacao').eq('status','aprovada').eq('ativa',true).limit(5000);
  if(!error&&data) DATA.perguntas=data.filter(r=>catById(r.categoria)).map(fromRow);
}
async function carregarConfig(){
  if(!sb) return;
  const {data}=await sb.from('config').select('*').eq('id',1).maybeSingle();
  if(data) CFG={...CFG,...data};
}
async function login(){
  if(!sb) return;
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
}
async function sair(){ if(sb) await sb.auth.signOut(); }
async function setSession(s){
  const uid=(s&&s.user&&s.user.id)||null;
  if(uid===AUTH.uid && (AUTH.perfil||!uid)) return;
  AUTH.uid=uid;AUTH.user=s?s.user:null;AUTH.perfil=null;
  if(uid){
    const {data}=await sb.from('perfis').select('id,nome,avatar,papel,vulgo').eq('id',uid).maybeSingle();
    AUTH.perfil=data||{id:uid,nome:(s.user.user_metadata||{}).full_name||'',avatar:(s.user.user_metadata||{}).avatar_url||'',papel:'jogador'};
    carregarVistos();
    if(isAdmin()) contarPendentes();
    carregarRede();
  } else {REDE.dados=REDE.rank=REDE.feed=REDE.duelos=null}
  if(VIEW==='home') home(); if(VIEW==='criar') criar(); if(VIEW==='comunidade') comunidade();
}

let SEEN={};
try{SEEN=JSON.parse(localStorage.getItem('rr_seen')||'{}')||{}}catch(e){SEEN={}}
function saveSeenLocal(){try{localStorage.setItem('rr_seen',JSON.stringify(SEEN))}catch(e){}}
function markSeen(key){SEEN[key]=Date.now();saveSeenLocal()}
async function carregarVistos(){
  if(!sb||!AUTH.uid) return;
  const {data}=await sb.from('vistos').select('pergunta_id,visto_em').eq('usuario_id',AUTH.uid).order('visto_em',{ascending:false}).limit(5000);
  (data||[]).forEach(r=>{const t=Date.parse(r.visto_em)||0;if(!SEEN[r.pergunta_id]||SEEN[r.pergunta_id]<t)SEEN[r.pergunta_id]=t});
  saveSeenLocal();
}
function logVisto(q,resultado){ if(sb&&AUTH.uid&&isUuid(q.id)) sb.from('vistos').insert({usuario_id:AUTH.uid,pergunta_id:q.id,resultado}).then(()=>{}); }
function logPartida(won,n){ if(sb&&AUTH.uid) sb.from('partidas').insert({usuario_id:AUTH.uid,pontos:S.score,acertos:S.right,respondidas:S.count,personagens:n,venceu:!!won}).then(()=>{}); }

/* ---------- estado do jogo ---------- */
let S, VIEW='home', PEND=0;
function best(){try{return +localStorage.getItem('rr_best')||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem('rr_best',v)}catch(e){}}
function newGame(){
  S={score:0,lives:CFG.vidas,streak:0,meter:0,crowns:{},used:new Set(),rot:0,timer:null,count:0,right:0};
  CROWN_CATS.forEach(c=>S.crowns[c]=false);
}
const app=document.getElementById('app');
function render(html,wide){clearInterval(S&&S.timer);app.innerHTML=`<div class="screen fade${wide?' wide':''}">${html}</div>`;app.scrollTop=0}

function hud(){
  const n=Math.max(CFG.vidas,1);
  const hearts=n<=5?Array.from({length:n},(_,i)=>HEART(i<S.lives)).join(''):`${HEART(true)} ${S.lives}`;
  return `<div class="row"><span class="pill" aria-label="${S.lives} vidas">${hearts}</span><span class="pill bang" style="font-size:clamp(16px,5vw,20px);font-weight:400">${S.score} PTS</span><span class="pill bang" style="font-size:clamp(15px,4.6vw,18px);font-weight:400">SEQ ${S.streak}</span></div>`;
}
function meterRow(){
  return `<div class="row" style="gap:10px;justify-content:flex-start"><span class="bang" style="font-size:clamp(15px,4.6vw,18px);white-space:nowrap">MEDIDOR DE COROA</span><div style="display:flex;gap:6px;flex:1">${Array.from({length:CFG.medidor},(_,i)=>`<span style="flex:1;height:16px;border-radius:999px;border:2.5px solid #1a1a1a;background:${i<S.meter?'#F5A623':'#fff'}"></span>`).join('')}</div></div>`;
}
function crewRow(){
  return `<div class="card" style="padding:10px 10px 12px;border-radius:16px;box-shadow:4px 4px 0 #1a1a1a">
  <div class="row" style="margin-bottom:8px;padding:0 2px"><span class="bang" style="font-size:19px">SUA CREW</span><span class="small">${CROWN_CATS.filter(c=>S.crowns[c]).length} de 5</span></div>
  <div class="crew">${CROWN_CATS.map(id=>{const c=catById(id);const on=S.crowns[id];return `<div class="crewcell"><div class="crewav ${on?'on':''}" style="${on?`background:${c.color}`:''}">${mascot(c.m)}</div><span class="crewname" style="color:${on?'#1a1a1a':'#6b6b6b'}">${c.name}</span></div>`}).join('')}</div>
  <div style="margin-top:10px">${meterRow()}</div></div>`;
}

function acctChip(){
  if(!sb) return '<span></span>';
  if(!AUTH.uid) return `<button class="acct login" id="acct">${GOOGLE}<span>Entrar com Google</span></button>`;
  const p=AUTH.perfil||{};const first=String(p.nome||'Você').split(' ')[0];
  const img=p.avatar?`<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer">`:`<span class="ph"></span>`;
  return `<button class="acct" id="acct">${img}<span>${esc(first)}</span>${isAdmin()&&PEND?`<span class="badge">${PEND}</span>`:''}</button>`;
}
function bindAcct(){
  const b=document.getElementById('acct'); if(!b) return;
  b.onclick=()=>{ if(!AUTH.uid) return login(); menuConta(); };
}
function menuConta(){
  const p=AUTH.perfil||{};
  const el=document.createElement('div');el.className='sheet';
  el.innerHTML=`<div class="card stack fade"><div class="row" style="justify-content:flex-start;gap:12px">${p.avatar?`<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer" style="width:48px;height:48px;border-radius:50%;border:3px solid #1a1a1a">`:''}<div><div style="font-weight:800">${esc(p.nome||'')}</div><div class="small">${p.vulgo?'@'+esc(p.vulgo)+' · ':''}${isAdmin()?'Admin':'Jogador'}</div></div></div>
  ${isAdmin()?`<button class="btn sm" id="m-admin" style="background:#3C7DD9;color:#fff">PAINEL ADMIN ${PEND?`<span class="badge">${PEND}</span>`:''}</button>`:''}
  <button class="btn sm" id="m-sair" style="background:#fff">SAIR DA CONTA</button>
  <button class="btn sm" id="m-fechar" style="background:#E8E6E1">FECHAR</button></div>`;
  document.body.appendChild(el);
  const close=()=>el.remove();
  el.onclick=e=>{if(e.target===el)close()};
  el.querySelector('#m-fechar').onclick=close;
  el.querySelector('#m-sair').onclick=async()=>{close();await sair()};
  const a=el.querySelector('#m-admin'); if(a) a.onclick=()=>{close();admin('aprovar')};
}
async function contarPendentes(){
  if(!sb||!isAdmin()) return;
  const {count}=await sb.from('perguntas').select('id',{count:'exact',head:true}).eq('status','pendente');
  PEND=count||0; if(VIEW==='home') home();
}

  <div style="text-align:center;font-weight:600;line-height:1.45">${topo||'Fica igual app: abre direto da tela de início, em tela cheia, sem barra do navegador.'}</div>
  <div class="stack" style="gap:10px">${passos}</div>

/* ---------- roleta ---------- */
const ANG={campeoes:30,mcs:90,confrontos:150,bda:210,old:270,impossivel:330};
function wheelSVG(){
  const pts=[[150,10],[271.24,80],[271.24,220],[150,290],[28.76,220],[28.76,80]];
  const lab=[[200,63,30],[250,150,90],[200,237,-30],[100,237,30],[52,150,-90],[100,63,-30]];
  let s=`<svg id="wheel" viewBox="0 0 300 300" role="img" aria-label="Roleta de categorias"><circle cx="150" cy="150" r="146" fill="#fff" stroke="#1a1a1a" stroke-width="4"/>`;
  CATS.forEach((c,i)=>{const a=pts[i],b=pts[(i+1)%6];s+=`<path d="M150 150 L${a[0]} ${a[1]} A140 140 0 0 1 ${b[0]} ${b[1]} Z" fill="${c.color}" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>`;});
  CATS.forEach((c,i)=>{const l=lab[i];s+=`<text x="${l[0]}" y="${l[1]}" transform="rotate(${l[2]} ${l[0]} ${l[1]})" font-family="Bangers" font-size="19" letter-spacing="1" text-anchor="middle" dominant-baseline="middle" fill="${c.txt}">${c.name.toUpperCase()}</text>`;});
  return s+`</svg>`;
}
function pickQuestion(catId){
  const pool=allQuestions().filter(q=>q.cat===catId&&!S.used.has(q.key));
  if(!pool.length) return null;
  const nunca=pool.filter(q=>!SEEN[q.key]);
  if(nunca.length) return nunca[Math.floor(Math.random()*nunca.length)];
  const velhas=pool.sort((a,b)=>SEEN[a.key]-SEEN[b.key]).slice(0,Math.min(3,pool.length));
  return velhas[Math.floor(Math.random()*velhas.length)];
}
function wheel(){
  VIEW='wheel';
  render(`${hud()}
  <h2 class="title3d t-l" style="margin-top:4px">GIRA A RODA!</h2>
  <div class="marker" style="text-align:center;font-size:clamp(14px,4.4vw,16px)">e reza pra não cair no Impossível</div>
  <div class="wheelwrap">${wheelSVG()}
  <svg class="pointer" viewBox="0 0 40 46" aria-hidden="true"><path d="M4 3 H36 L20 43 Z" fill="#fff" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/></svg>
  <button class="hub" id="spin">GIRA!</button></div>
  <div style="margin-top:auto">${crewRow()}</div>`);
  const w=document.getElementById('wheel');
  w.style.transition='none';w.style.transform=`rotate(${S.rot}deg)`;
  document.getElementById('spin').onclick=e=>{
    e.currentTarget.disabled=true;
    const all=allQuestions();
    const avail=CATS.filter(c=>all.some(q=>q.cat===c.id&&!S.used.has(q.key)));
    if(!avail.length) return end(false,'Acabaram as perguntas do banco!');
    const fresh=avail.filter(c=>all.some(q=>q.cat===c.id&&!S.used.has(q.key)&&!SEEN[q.key]));
    const bag=avail.concat(fresh,fresh);
    const cat=bag[Math.floor(Math.random()*bag.length)];
    S.rot=Math.ceil(S.rot/360)*360+360*5-ANG[cat.id]+(Math.random()*36-18);
    w.getBoundingClientRect();
    w.style.transition='transform 3.4s cubic-bezier(.12,.75,.18,1)';
    w.style.transform=`rotate(${S.rot}deg)`;
    setTimeout(()=>ask(cat,false),3550);
  };
}

/* ---------- escolher personagem ---------- */
function choose(){
  VIEW='choose';
  const miss=CROWN_CATS.filter(c=>!S.crowns[c]).map(catById);
  render(`${hud()}

  <div class="stack" style="margin-top:4px">${miss.map(c=>{const has=allQuestions().some(q=>q.cat===c.id&&!S.used.has(q.key));return `<button class="pick" data-c="${c.id}" ${has?'':'disabled'} style="background:${c.color};color:${c.txt}"><span class="avatar" style="width:54px;height:54px">${mascot(c.m)}</span><span style="text-align:left"><span class="bang" style="font-size:clamp(20px,6.5vw,26px);display:block;line-height:1">${esc(c.m.name).toUpperCase()}</span><span style="font-weight:800;font-size:14px">${has?esc(c.name):'Sem perguntas sobrando'}</span></span></button>`}).join('')}</div>`);

/* ---------- pergunta ---------- */
function ask(cat,crown){
  VIEW='ask';
  const q=pickQuestion(cat.id); if(!q) return crown?choose():wheel();
  S.used.add(q.key);S.count++;markSeen(q.key);
  const opts=shuffle([q.c,...q.w]);
  const T=cat.id==='impossivel'?CFG.tempo_impossivel:CFG.tempo;let t=T;
  render(`${hud()}
  ${crown?`<div class="pill bang" style="align-self:center;background:#F5A623;font-size:clamp(16px,5vw,20px);font-weight:400">${CROWN_SVG('#fff')} VALENDO ${esc(cat.m.name).toUpperCase()}</div>`:''}
  <div class="row" style="justify-content:flex-start;gap:12px"><div class="avatar" style="width:54px;height:54px;background:${cat.bg||cat.color}">${mascot(cat.m)}</div>
  <div style="min-width:0"><div class="bang" style="font-size:clamp(22px,7vw,28px);color:${cat.color};-webkit-text-stroke:1px #1a1a1a;line-height:1">${cat.name.toUpperCase()}</div><div class="small">com ${esc(cat.m.name)} · pergunta ${S.count}</div></div>
  <div class="secs bang"><span id="sec">${t}</span></div></div>
  <div class="timer"><i id="bar" style="width:100%"></i></div>
  <div style="position:relative;margin-top:8px"><div class="card qcard" style="padding:16px 16px 18px;border-radius:24px"><div class="marker hide-short" style="color:${cat.id==='impossivel'?'#8E2E43':cat.color};font-size:14px;margin-bottom:6px;-webkit-text-stroke:.3px #1a1a1a">${esc(cat.m.name)} pergunta:</div><div class="qtext" style="font-size:clamp(17px,5.3vw,21px);font-weight:800;line-height:1.28">${esc(q.q)}</div></div><div class="hide-short" style="position:absolute;right:-4px;top:-22px">${BOLT}</div></div>
  <div class="stack opts" style="margin-top:4px" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="let" style="background:${['#F5A623','#E64B55','#18A36A','#3C7DD9'][i]};${i===3?'color:#fff':''}">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`);
  const bar=document.getElementById('bar'),sec=document.getElementById('sec');
  requestAnimationFrame(()=>{bar.style.width=((t-1)/T*100)+'%'});
  S.timer=setInterval(()=>{t--;sec.textContent=t;bar.style.width=(Math.max(t-1,0)/T*100)+'%';if(t<=0){clearInterval(S.timer);answer(null,q,cat,crown,opts)}},1000);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{clearInterval(S.timer);answer(opts[+b.dataset.i],q,cat,crown,opts)});
}

function answer(v,q,cat,crown,opts){
  if(S.answered===q.key) return; S.answered=q.key;
  const ok=v===q.c;
  logVisto(q,ok?'acertou':(v===null?'tempo':'errou'));
  document.querySelectorAll('.opt').forEach(b=>{const val=opts[+b.dataset.i];b.disabled=true;if(val===q.c)b.classList.add('right');else if(val===v)b.classList.add('wrong');else b.classList.add('dim')});
  let gained=null,msg='',full=false;
  if(ok){
    S.streak++;S.right++;
    const pts=(crown?200:cat.id==='impossivel'?250:100)+Math.max(0,S.streak-1)*20;S.score+=pts;msg=`+${pts} PTS`;
    if(crown){S.crowns[cat.id]=true;gained=cat;S.meter=0}
    else{S.meter=(cat.id==='impossivel'&&CFG.impossivel_enche)?CFG.medidor:Math.min(CFG.medidor,S.meter+1);full=S.meter>=CFG.medidor&&CROWN_CATS.some(c=>!S.crowns[c])}
  } else {
    S.streak=0;S.lives--; if(crown) S.meter=0;
    const o=document.getElementById('opts'); if(o) o.classList.add('shake');
  }
  const head = ok ? (gained?'É DA CREW!':cat.id==='impossivel'?'LENDÁRIO!':['PUNCHLINE!','FATALITY!','RIMOU BONITO!'][Math.floor(Math.random()*3)]) : (v===null?'O TEMPO ACABOU!':['ATRAVESSOU O BEAT!','SEM RIMA, PARCEIRO!','FALTOU FLOW!'][Math.floor(Math.random()*3)]);
  setTimeout(()=>feedback(ok,head,msg,q,cat,gained,full,crown),650);
}

function feedback(ok,head,msg,q,cat,gained,full,crown){
  VIEW='feedback';
  const won=CROWN_CATS.every(c=>S.crowns[c]);
  const label = won||S.lives<=0 ? 'VER RESULTADO' : full ? 'ESCOLHER PERSONAGEM' : 'GIRAR DE NOVO';
  render(`${hud()}
  <h2 class="title3d t-m" style="margin-top:10px;${ok?'':'color:#E64B55'};transform:rotate(-3deg)">${head}</h2>
  <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">${ok?`<span class="pill bang" style="background:#18A36A;font-size:20px;font-weight:400">${msg}</span>`:`<span class="pill bang" style="background:#E64B55;font-size:20px;font-weight:400">-1 VIDA</span>`}${gained?`<span class="pill bang" style="background:${gained.color};color:${gained.txt};font-size:20px;font-weight:400">${CROWN_SVG('#F5A623')} ${esc(gained.m.name).toUpperCase()}</span>`:''}${crown&&!ok?`<span class="pill bang" style="font-size:18px;font-weight:400">MEDIDOR ZEROU</span>`:''}</div>
  <div class="card" style="padding:14px 16px"><div class="row" style="justify-content:flex-start;gap:10px"><div class="avatar" style="width:46px;height:46px;background:${cat.bg||cat.color}">${mascot(cat.m)}</div><div style="min-width:0"><div class="small">Resposta certa</div><div class="bang" style="font-size:22px;line-height:1.05">${esc(q.c).toUpperCase()}</div></div></div>
  ${q.ex?`<div style="font-size:15px;line-height:1.45;margin-top:8px;font-weight:500">${esc(q.ex)}</div>`:''}<div class="marker" style="font-size:13px;margin-top:6px">— ${esc(cat.m.name)}</div></div>
  <div>${crewRow()}</div>
  <div style="margin-top:auto"><button class="btn" id="next">${label}</button></div>`);
  document.getElementById('next').onclick=()=>{ if(won||S.lives<=0) return end(won); if(full) return choose(); wheel(); };
}

function end(won,note){
  VIEW='end';
  const rec=S.score>best();if(rec)saveBest(S.score);
  const n=CROWN_CATS.filter(c=>S.crowns[c]).length;
  logPartida(won,n);
  render(`<h2 class="title3d ${won?'t-xl':'t-l'}" style="margin-top:18px;${won?'':'color:#E64B55'}">${won?'RAINHA<br>DA RODA!':'FIM DA<br>BATALHA'}</h2>

  <div class="card" style="padding:16px">
  <div class="row"><span class="bang" style="font-size:22px">PONTOS</span><span class="bang" style="font-size:30px">${S.score}</span></div>
  <div class="row"><span style="font-weight:700">Acertos</span><span style="font-weight:800">${S.right} de ${S.count}</span></div>
  <div class="row"><span style="font-weight:700">Personagens</span><span style="font-weight:800">${n} de 5</span></div>
  ${rec?'<div class="bang" style="font-size:20px;color:#18A36A;margin-top:6px">NOVO RECORDE!</div>':`<div class="small" style="margin-top:6px">Recorde: ${best()} pts</div>`}</div>
  <div>${crewRow()}</div>

  bindAcct();
  document.getElementById('again').onclick=()=>{newGame();wheel()};
  document.getElementById('home').onclick=home;
}

function readForm(admin){

const limpaVulgo=v=>String(v||'').trim().replace(/^@+/,'').toLowerCase();
const erroMsg=e=>{const m=String((e&&e.message)||'');return /[À-ú]|vulgo|amizade|Pedido|Entre/.test(m)&&m.length<90?m:'Deu ruim na conexão. Tenta de novo.'};
function foto(p,size){
  size=size||40;const s=`width:${size}px;height:${size}px;flex:0 0 ${size}px;border-radius:50%;border:2.5px solid #1a1a1a;`;
  if(p&&p.avatar) return `<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer" style="${s}object-fit:cover;background:#fff">`;
  const l=String((p&&(p.vulgo||p.nome))||'?').charAt(0).toUpperCase();
  return `<span class="bang" style="${s}display:inline-flex;align-items:center;justify-content:center;background:#F5A623;font-size:${Math.round(size*.5)}px">${esc(l)}</span>`;
}
function quando(t){
  const d=(Date.now()-Date.parse(t))/1000;if(!(d>=0))return '';
  if(d<60)return 'agora';if(d<3600)return `há ${Math.floor(d/60)} min`;if(d<86400)return `há ${Math.floor(d/3600)} h`;
  if(d<86400*7){const n=Math.floor(d/86400);return `há ${n} dia${n>1?'s':''}`}
  return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
}
async function carregarRede(){

function escolherVulgo(top,atual){
  render(top+`<h2 class="title3d t-l" style="margin-top:4px">${atual?'TROCA TEU':'ESCOLHE TEU'}<br>VULGO</h2>
  <div class="card stack" style="padding:16px"><div style="font-weight:600;line-height:1.45">É por ele que os parça te acham na roda. Letras minúsculas, números, ponto ou _ (3 a 20).</div>
  <form id="vf" class="stack"><div class="fl"><div style="display:flex;align-items:center;gap:6px"><span class="bang" style="font-size:28px">@</span><input id="vi" value="${esc(atual||'')}" placeholder="teu_vulgo" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="21" aria-label="Vulgo"></div></div>
  <div id="verr" class="small" style="color:#8a1c25;font-weight:700;min-height:0"></div>
  <button class="btn sm" id="vsalvar" style="background:#18A36A">SALVAR VULGO</button>${atual?`<button type="button" class="btn sm" id="vcanc" style="background:#fff">CANCELAR</button>`:''}</form></div>`);
  document.getElementById('back').onclick=atual?()=>comunidade():home;
  const c=document.getElementById('vcanc');if(c)c.onclick=()=>comunidade();
  const inp=document.getElementById('vi');
  inp.oninput=()=>{const p=inp.selectionStart;const v=inp.value.replace(/^@+/,'').toLowerCase().replace(/\s/g,'_');if(v!==inp.value){inp.value=v;try{inp.setSelectionRange(p,p)}catch(e){}}};
  document.getElementById('vf').onsubmit=async e=>{
    e.preventDefault();const err=document.getElementById('verr'),b=document.getElementById('vsalvar');
    const v=limpaVulgo(inp.value);
    if(!VULGO_RE.test(v)){err.textContent='Use de 3 a 20 letras minúsculas, números, ponto ou _';return}
    if(v===atual) return comunidade();
    b.disabled=true;err.textContent='';
    const {error}=await sb.rpc('definir_vulgo',{novo:v});b.disabled=false;
    if(error){err.textContent=erroMsg(error);return}
    if(REDE.dados&&REDE.dados.eu)REDE.dados.eu.vulgo=v;if(AUTH.perfil)AUTH.perfil.vulgo=v;
    REDE.rank=REDE.feed=null;await carregarRede();comunidade();
  };
}
const redeBox=()=>document.getElementById('rede');
const vazioRede=t=>`<div class="card" style="padding:16px;text-align:center;font-weight:600;line-height:1.45">${t}</div>`;
async function redeRanking(){
  const esc0=REDE.escopo||'parcas', modo=REDE.modo||'recorde', key=esc0+':'+modo;
  const b0=redeBox();
  const seg=(name,opts,cur)=>`<div class="seg">${opts.map(([k,l])=>`<button class="${cur===k?'on':''}" data-${name}="${k}">${l}</button>`).join('')}</div>`;
  const topo=`<div style="display:flex;gap:8px;flex-wrap:wrap">${seg('esc',[['parcas','Parças'],['geral','Geral']],esc0)}${seg('modo',[['recorde','Recorde'],['duelos','Duelos']],modo)}</div>`;
  if(b0&&!(REDE.rank&&REDE.rank[key])) b0.innerHTML=topo+'<div class="small">Carregando…</div>';
  const bind=()=>{
    document.querySelectorAll('[data-esc]').forEach(x=>x.onclick=()=>{REDE.escopo=x.dataset.esc;redeRanking()});
    document.querySelectorAll('[data-modo]').forEach(x=>x.onclick=()=>{REDE.modo=x.dataset.modo;redeRanking()});
  };
  bind();
  if(!REDE.rank) REDE.rank={};
  if(!REDE.rank[key]){
    const {data}=esc0==='geral'?await sb.rpc('ranking_geral',{modo}):await sb.rpc('ranking_amigos',{modo});
    REDE.rank[key]=esc0==='geral'?(data||{lista:[],eu:null,total:0}):{lista:data||[]};
  }
  const b=redeBox();if(!b||REDE.tab!=='ranking'||(REDE.escopo||'parcas')!==esc0||(REDE.modo||'recorde')!==modo)return;
  const R=REDE.rank[key];let L=R.lista;
  if(esc0==='parcas') L=L.map((r,i)=>({...r,pos:i+1}));
  if(esc0==='parcas'&&modo==='duelos') L=L.filter(r=>r.eu||r.duelos_v+r.duelos_d+r.duelos_e>0).map((r,i)=>({...r,pos:i+1}));
  let h=topo;
  if(esc0==='parcas'&&(R.lista.length<2)) h+=vazioRede('Ainda tá só tu na roda. Adiciona os parça pelo vulgo e vê quem manda.');
  else if(esc0==='parcas'&&modo==='duelos'&&L.length<2) h+=vazioRede('Ninguém duelou ainda. Desafia um parça e abre o placar.');
  if(esc0==='geral'&&!L.length) h+=vazioRede(modo==='duelos'?'Ainda não rolou nenhum duelo no jogo.':'Ainda ninguém com vulgo jogou.');
  if(esc0==='geral'&&L.length) h+=`<div class="small" style="margin:0">${R.total} jogador${R.total==1?'':'es'} no ranking${modo==='duelos'?' de duelos':''} · top 50</div>`;
  h+=L.map(r=>rankCard(r,r.pos,modo)).join('');
  if(esc0==='geral'&&R.eu&&R.eu.pos>50) h+=`<div class="small" style="text-align:center;margin:0">…</div>`+rankCard(R.eu,R.eu.pos,modo);
  if(esc0==='geral'&&!R.eu&&L.length) h+=`<div class="small" style="text-align:center">${modo==='duelos'?'Tu ainda não terminou nenhum duelo.':'Joga uma partida logado pra entrar no ranking.'}</div>`;
  b.innerHTML=h;bind();bindDesafiar(b);
}
function rankCard(r,pos,modo){
  const med=['#F5A623','#C9CED6','#D9A066'][pos-1];const du=modo==='duelos';
  const big=du?r.duelos_v:r.recorde, lab=du?(r.duelos_v==1?'vitória':'vitórias'):'recorde';
  const linha=du?`${r.duelos_d} derrota${r.duelos_d==1?'':'s'}${r.duelos_e?` · ${r.duelos_e} empate${r.duelos_e==1?'':'s'}`:''} · ${r.aproveitamento}% aproveitamento`
                :`${r.vitorias} vitória${r.vitorias==1?'':'s'} · ${r.partidas} partida${r.partidas==1?'':'s'} · ${r.acerto}% acerto`;

  <div class="small" style="margin:0;font-size:12px;line-height:1.3">${linha}</div></div>
  <div style="text-align:right"><div class="bang" style="font-size:22px;line-height:1">${big}</div><div class="small" style="margin:0;font-size:11px">${lab}</div></div></div>${r.eu||!uid?'':`<div style="display:flex;justify-content:flex-end;margin-top:6px">${btnDesafiar(uid,r.vulgo)}</div>`}</div>`;

function redeParcas(){
  const b=redeBox();if(!b||REDE.tab!=='parcas')return;

let D=null;

  <div style="margin-top:auto"><button class="btn" id="bora">BORA</button></div>`);

function duelPergunta(){
  if(!D) return home();
  const q=D.qs[D.i]; if(!q) return duelEnviar();
  const cat=catById(q.cat)||CATS[0];const opts=shuffle([q.c,...q.w]);const T=D.tempo;let t=T;const t0=Date.now();
  markSeen(q.id);
  render(`<div class="row"><span class="pill bang" style="font-size:clamp(15px,4.6vw,18px);font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">DUELO × @${esc(D.vulgo||'')}</span><span class="pill" style="font-size:14px;font-weight:800;white-space:nowrap">${D.i+1} de ${D.qs.length}</span></div>
  <div class="row" style="justify-content:flex-start;gap:12px"><div class="avatar" style="width:54px;height:54px;background:${cat.bg||cat.color}">${mascot(cat.m)}</div>
  <div style="min-width:0"><div class="bang" style="font-size:clamp(22px,7vw,28px);color:${cat.color};-webkit-text-stroke:1px #1a1a1a;line-height:1">${cat.name.toUpperCase()}</div><div class="small">${D.acertos} acerto${D.acertos===1?'':'s'} até agora</div></div>
  <div class="secs bang"><span id="sec">${t}</span></div></div>
  <div class="timer"><i id="bar" style="width:100%"></i></div>
  <div class="card qcard" style="padding:16px 16px 18px;border-radius:24px;margin-top:8px"><div class="qtext" style="font-size:clamp(17px,5.3vw,21px);font-weight:800;line-height:1.28">${esc(q.q)}</div></div>
  <div class="stack opts" style="margin-top:4px" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="let" style="background:${['#F5A623','#E64B55','#18A36A','#3C7DD9'][i]};${i===3?'color:#fff':''}">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`);
  const bar=document.getElementById('bar'),sec=document.getElementById('sec');let done=false;
  requestAnimationFrame(()=>{bar.style.width=((t-1)/T*100)+'%'});
  const fim=v=>{
    if(done) return; done=true; clearInterval(S.timer);
    const ms=Math.min(Date.now()-t0,T*1000);const ok=v===q.c;if(ok)D.acertos++;

  };
  S.timer=setInterval(()=>{t--;sec.textContent=t;bar.style.width=(Math.max(t-1,0)/T*100)+'%';if(t<=0)fim(null)},1000);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>fim(opts[+b.dataset.i]));
}
async function duelEnviar(){

/* ---------- importar planilha ---------- */
function carregarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>no(new Error('xlsx'));document.head.appendChild(s)});
}
function catDaPlanilha(v){
  const n=norm(v).replace(/[^a-z0-9 ]/g,'').trim(); if(!n) return null;
  for(const c of CATS){ if(n===c.id||n===norm(c.name)||n===norm(c.m.name)) return c.id; }
  if(/imposs|rainha/.test(n)) return 'impossivel';
  if(/campe|nacional|vencedor/.test(n)) return 'campeoes';
  if(/confront|final|duelo/.test(n)) return 'confrontos';
  if(/bda|aldeia/.test(n)) return 'bda';
  if(/old|antig|histor/.test(n)) return 'old';
  if(/^mc|mcs|artista/.test(n)) return 'mcs';
  return null;
}
function lerLinhas(rows){
  // acha as colunas pelo nome, aceitando variações
  const out=[];
  for(const raw of rows){
    const r={};Object.keys(raw).forEach(k=>r[norm(k).replace(/[^a-z0-9]/g,'')]=String(raw[k]??'').trim());
    const g=(...ks)=>{for(const k of ks){if(r[k])return r[k]}return ''};
    const pergunta=g('pergunta','question','enunciado');
    if(!pergunta&&!Object.values(r).some(Boolean)) continue;
    let certa=g('certa','respostacerta','resposta','correta','correct');let erradas=[g('errada1','erradaa','errada'),g('errada2','erradab'),g('errada3','erradac')];
    const alts=['a','b','c','d'].map(x=>g('alternativa'+x,'alternativa'+x.toUpperCase(),'opcao'+x,'alt'+x,x));
    if(alts.every(Boolean)&&/^[a-d]$/i.test(certa)){const i='abcd'.indexOf(certa.toLowerCase());certa=alts[i];erradas=alts.filter((_,j)=>j!==i)}
    const cat=catDaPlanilha(g('categoria','category','cat','tema'));
    const st=norm(g('status'));
    const it={categoria:cat,pergunta,certa,errada1:erradas[0],errada2:erradas[1],errada3:erradas[2],explicacao:g('explicacao','explicacao','comentario','fonte_explicacao')||null,revisar:/revis|pend/.test(st),catOriginal:g('categoria','category','cat','tema')};
    it.erro=!pergunta?'sem pergunta':!certa?'sem resposta certa':erradas.some(x=>!x)?'faltam respostas erradas':!cat?`categoria "${it.catOriginal||'vazia'}" não reconhecida`:new Set([certa,...erradas].map(norm)).size<4?'respostas repetidas':pergunta.length>300?'pergunta longa demais':null;
    out.push(it);
  }
  return out;
}

      <div class="small" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.vulgo?'@'+esc(r.vulgo):'sem vulgo'}${r.email?' · '+esc(r.email):''}</div></div></div>
      <div class="small" style="margin:6px 0 0">${r.partidas} partida${r.partidas==1?'':'s'} · ${r.vitorias} vitória${r.vitorias==1?'':'s'} · ${r.duelos} duelo${r.duelos==1?'':'s'} · ${r.parcas} parça${r.parcas==1?'':'s'}${r.ultimo?' · visto '+quando(r.ultimo):''}</div>
      ${r.id===AUTH.uid?'':`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" data-acts="${r.id}"><button class="mini" data-vg="${r.id}">Trocar vulgo</button><button class="mini ${r.bloqueado?'g':'r'}" data-bl="${r.id}">${r.bloqueado?'Desbloquear':'Bloquear'}</button><button class="mini ${r.papel==='admin'?'r':'g'}" data-pp="${r.id}">${r.papel==='admin'?'Tirar admin':'Tornar admin'}</button></div>`}</div>`).join('');
    const get=id=>rows.find(y=>y.id===id);
    document.querySelectorAll('[data-pp]').forEach(x=>x.onclick=async()=>{
      if(x.dataset.arm!=='1'){x.dataset.arm='1';x.textContent='Confirmar';return}
      const r=get(x.dataset.pp);const novo=r.papel==='admin'?'jogador':'admin';x.disabled=true;
      const {error}=await sb.from('perfis').update({papel:novo}).eq('id',r.id);if(!error)r.papel=novo;draw(document.getElementById('eb').value);
    });
    document.querySelectorAll('[data-bl]').forEach(x=>x.onclick=async()=>{
      const r=get(x.dataset.bl);
      if(!r.bloqueado&&x.dataset.arm!=='1'){x.dataset.arm='1';x.textContent='Confirmar bloqueio';return}
      x.disabled=true;const {data:v,error}=await sb.rpc('admin_bloquear',{alvo:r.id,bloquear:!r.bloqueado});if(!error)r.bloqueado=v;draw(document.getElementById('eb').value);
    });
    document.querySelectorAll('[data-vg]').forEach(x=>x.onclick=()=>{
      const r=get(x.dataset.vg);const a=document.querySelector(`[data-acts="${r.id}"]`);
      a.innerHTML=`<div class="fl" style="flex:1;min-width:140px"><input id="vg-${r.id}" value="${esc(r.vulgo||'')}" placeholder="novo_vulgo (vazio apaga)" autocapitalize="none" maxlength="21"></div><button class="mini g" id="vgs-${r.id}">Salvar</button><button class="mini" id="vgc-${r.id}">Cancelar</button><div class="small" id="vge-${r.id}" style="width:100%;margin:0;color:#8a1c25"></div>`;
      document.getElementById('vgc-'+r.id).onclick=()=>draw(document.getElementById('eb').value);
      document.getElementById('vgs-'+r.id).onclick=async e=>{e.target.disabled=true;const {data:v,error}=await sb.rpc('admin_vulgo',{alvo:r.id,novo:document.getElementById('vg-'+r.id).value});if(error){e.target.disabled=false;document.getElementById('vge-'+r.id).textContent=erroMsg(error);return}r.vulgo=v||null;draw(document.getElementById('eb').value)};
    });
  };
  document.getElementById('eb').oninput=e=>draw(e.target.value);
  draw('');
}

/* ---------- início ---------- */
(async function boot(){
  newGame(); if(precisaInstalar()) instalar(); else home();
  if(!sb) return;
  try{
    const {data}=await sb.auth.getSession();
    await setSession(data.session);
    if(location.hash.includes('access_token')||location.search.includes('code=')) history.replaceState(null,'',location.pathname);
  }catch(e){}
  sb.auth.onAuthStateChange((_ev,s)=>{setTimeout(()=>setSession(s),0)});
  await Promise.all([carregarConfig(),carregarPerguntas()]);
  if(VIEW==='home') home();
})();

</script>
