function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const catById = id => CATS.find(c=>c.id===id);

const isUuid = s => /^[0-9a-f-]{36}$/i.test(String(s||''));

/* ---------- Supabase ---------- */
const SB_OK = /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length>30 && !!window.supabase;
const sb = SB_OK ? window.supabase.createClient(SUPABASE_URL.replace(/\/$/,''), SUPABASE_ANON_KEY) : null;
const AUTH = {uid:null, user:null, perfil:null};
const isAdmin = () => !!(AUTH.perfil && AUTH.perfil.papel==='admin');
let CFG = {vidas:3, tempo:20, tempo_impossivel:25, medidor:3, impossivel_enche:true};
const DATA = {perguntas:null};

function fromRow(r){return {id:r.id,cat:r.categoria,q:r.pergunta,c:r.certa,w:[r.errada1,r.errada2,r.errada3],ex:r.explicacao||'',key:r.id}}
function allQuestions(){
  if(DATA.perguntas&&DATA.perguntas.length) return DATA.perguntas;
  return Q.map((q,i)=>({cat:q[0],q:q[1],c:q[2],w:q[3],ex:q[4],id:'b'+i,key:'b'+i}));
}
async function carregarPerguntas(){
  if(!sb) return;
  const {data,error}=await sb.from('perguntas').select('id,categoria,pergunta,certa,errada1,errada2,errada3,explicacao').eq('status','aprovada').eq('ativa',true).limit(5000);
  if(!error&&data) DATA.perguntas=data.filter(r=>catById(r.categoria)).map(fromRow);
}
async function carregarConfig(){
  if(!sb) return;
  const {data}=await sb.from('config').select('*').eq('id',1).maybeSingle();
  if(data) CFG={...CFG,...data};
}
async function login(){
  if(!sb) return;
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
}
async function sair(){ if(sb) await sb.auth.signOut(); }
async function setSession(s){
  const uid=(s&&s.user&&s.user.id)||null;
  if(uid===AUTH.uid && (AUTH.perfil||!uid)) return;
  AUTH.uid=uid;AUTH.user=s?s.user:null;AUTH.perfil=null;
  if(uid){
    const {data}=await sb.from('perfis').select('id,nome,avatar,papel,vulgo').eq('id',uid).maybeSingle();
    AUTH.perfil=data||{id:uid,nome:(s.user.user_metadata||{}).full_name||'',avatar:(s.user.user_metadata||{}).avatar_url||'',papel:'jogador'};
    carregarVistos();
    if(isAdmin()) contarPendentes();
    carregarRede();
  } else {REDE.dados=REDE.rank=REDE.feed=null}
  if(VIEW==='home') home(); if(VIEW==='criar') criar(); if(VIEW==='comunidade') comunidade();
}

let SEEN={};
try{SEEN=JSON.parse(localStorage.getItem('rr_seen')||'{}')||{}}catch(e){SEEN={}}
function saveSeenLocal(){try{localStorage.setItem('rr_seen',JSON.stringify(SEEN))}catch(e){}}
function markSeen(key){SEEN[key]=Date.now();saveSeenLocal()}
async function carregarVistos(){
  if(!sb||!AUTH.uid) return;
  const {data}=await sb.from('vistos').select('pergunta_id,visto_em').eq('usuario_id',AUTH.uid).order('visto_em',{ascending:false}).limit(5000);
  (data||[]).forEach(r=>{const t=Date.parse(r.visto_em)||0;if(!SEEN[r.pergunta_id]||SEEN[r.pergunta_id]<t)SEEN[r.pergunta_id]=t});
  saveSeenLocal();
}
function logVisto(q,resultado){ if(sb&&AUTH.uid&&isUuid(q.id)) sb.from('vistos').insert({usuario_id:AUTH.uid,pergunta_id:q.id,resultado}).then(()=>{}); }
function logPartida(won,n){ if(sb&&AUTH.uid) sb.from('partidas').insert({usuario_id:AUTH.uid,pontos:S.score,acertos:S.right,respondidas:S.count,personagens:n,venceu:!!won}).then(()=>{}); }

let S, VIEW='home', PEND=0;
function best(){try{return +localStorage.getItem('rr_best')||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem('rr_best',v)}catch(e){}}
function newGame(){
  S={score:0,lives:CFG.vidas,streak:0,meter:0,crowns:{},used:new Set(),rot:0,timer:null,count:0,right:0};
  CROWN_CATS.forEach(c=>S.crowns[c]=false);
}
const app=document.getElementById('app');
function render(html,wide){clearInterval(S&&S.timer);app.innerHTML=`<div class="screen fade${wide?' wide':''}">${html}</div>`;app.scrollTop=0}

function hud(){
  const n=Math.max(CFG.vidas,1);
  const hearts=n<=5?Array.from({length:n},(_,i)=>HEART(i<S.lives)).join(''):`${HEART(true)} ${S.lives}`;
  return `<div class="row"><span class="pill" aria-label="${S.lives} vidas">${hearts}</span><span class="pill bang" style="font-size:clamp(16px,5vw,20px);font-weight:400">${S.score} PTS</span><span class="pill bang" style="font-size:clamp(15px,4.6vw,18px);font-weight:400">SEQ ${S.streak}</span></div>`;
}
function meterRow(){
  return `<div class="row" style="gap:10px;justify-content:flex-start"><span class="bang" style="font-size:clamp(15px,4.6vw,18px);white-space:nowrap">MEDIDOR DE COROA</span><div style="display:flex;gap:6px;flex:1">${Array.from({length:CFG.medidor},(_,i)=>`<span style="flex:1;height:16px;border-radius:999px;border:2.5px solid #1a1a1a;background:${i<S.meter?'#F5A623':'#fff'}"></span>`).join('')}</div></div>`;
}
function crewRow(){
  return `<div class="card" style="padding:10px 10px 12px;border-radius:16px;box-shadow:4px 4px 0 #1a1a1a">
  <div class="row" style="margin-bottom:8px;padding:0 2px"><span class="bang" style="font-size:19px">SUA CREW</span><span class="small">${CROWN_CATS.filter(c=>S.crowns[c]).length} de 5</span></div>
  <div class="crew">${CROWN_CATS.map(id=>{const c=catById(id);const on=S.crowns[id];return `<div class="crewcell"><div class="crewav ${on?'on':''}" style="${on?`background:${c.color}`:''}">${mascot(c.m)}</div><span class="crewname" style="color:${on?'#1a1a1a':'#6b6b6b'}">${c.name}</span></div>`}).join('')}</div>
  <div style="margin-top:10px">${meterRow()}</div></div>`;
}

function acctChip(){
  if(!sb) return '<span></span>';
  if(!AUTH.uid) return `<button class="acct login" id="acct">${GOOGLE}<span>Entrar com Google</span></button>`;
  const p=AUTH.perfil||{};const first=String(p.nome||'Você').split(' ')[0];
  const img=p.avatar?`<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer">`:`<span class="ph"></span>`;
  return `<button class="acct" id="acct">${img}<span>${esc(first)}</span>${isAdmin()&&PEND?`<span class="badge">${PEND}</span>`:''}</button>`;
}
function bindAcct(){
  const b=document.getElementById('acct'); if(!b) return;
  b.onclick=()=>{ if(!AUTH.uid) return login(); menuConta(); };
}
function menuConta(){
  const p=AUTH.perfil||{};
  const el=document.createElement('div');el.className='sheet';
  el.innerHTML=`<div class="card stack fade"><div class="row" style="justify-content:flex-start;gap:12px">${p.avatar?`<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer" style="width:48px;height:48px;border-radius:50%;border:3px solid #1a1a1a">`:''}<div><div style="font-weight:800">${esc(p.nome||'')}</div><div class="small">${p.vulgo?'@'+esc(p.vulgo)+' · ':''}${isAdmin()?'Admin':'Jogador'}</div></div></div>
  ${isAdmin()?`<button class="btn sm" id="m-admin" style="background:#3C7DD9;color:#fff">PAINEL ADMIN ${PEND?`<span class="badge">${PEND}</span>`:''}</button>`:''}
  <button class="btn sm" id="m-sair" style="background:#fff">SAIR DA CONTA</button>
  <button class="btn sm" id="m-fechar" style="background:#E8E6E1">FECHAR</button></div>`;
  document.body.appendChild(el);
  const close=()=>el.remove();
  el.onclick=e=>{if(e.target===el)close()};
  el.querySelector('#m-fechar').onclick=close;
  el.querySelector('#m-sair').onclick=async()=>{close();await sair()};
  const a=el.querySelector('#m-admin'); if(a) a.onclick=()=>{close();admin('aprovar')};
}
async function contarPendentes(){
  if(!sb||!isAdmin()) return;
  const {count}=await sb.from('perguntas').select('id',{count:'exact',head:true}).eq('status','pendente');
  PEND=count||0; if(VIEW==='home') home();
}

  render(`${AUTH.uid?`<div class="row" style="justify-content:flex-end;min-height:44px">${acctChip()}</div>`:''}

/* ---------- roleta ---------- */
const ANG={campeoes:30,mcs:90,confrontos:150,bda:210,old:270,impossivel:330};
function wheelSVG(){
  const pts=[[150,10],[271.24,80],[271.24,220],[150,290],[28.76,220],[28.76,80]];
  const lab=[[200,63,30],[250,150,90],[200,237,-30],[100,237,30],[52,150,-90],[100,63,-30]];
  let s=`<svg id="wheel" viewBox="0 0 300 300" role="img" aria-label="Roleta de categorias"><circle cx="150" cy="150" r="146" fill="#fff" stroke="#1a1a1a" stroke-width="4"/>`;
  CATS.forEach((c,i)=>{const a=pts[i],b=pts[(i+1)%6];s+=`<path d="M150 150 L${a[0]} ${a[1]} A140 140 0 0 1 ${b[0]} ${b[1]} Z" fill="${c.color}" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>`;});
  CATS.forEach((c,i)=>{const l=lab[i];s+=`<text x="${l[0]}" y="${l[1]}" transform="rotate(${l[2]} ${l[0]} ${l[1]})" font-family="Bangers" font-size="19" letter-spacing="1" text-anchor="middle" dominant-baseline="middle" fill="${c.txt}">${c.name.toUpperCase()}</text>`;});
  return s+`</svg>`;
}
function pickQuestion(catId){
  const pool=allQuestions().filter(q=>q.cat===catId&&!S.used.has(q.key));
  if(!pool.length) return null;
  const nunca=pool.filter(q=>!SEEN[q.key]);
  if(nunca.length) return nunca[Math.floor(Math.random()*nunca.length)];
  const velhas=pool.sort((a,b)=>SEEN[a.key]-SEEN[b.key]).slice(0,Math.min(3,pool.length));
  return velhas[Math.floor(Math.random()*velhas.length)];
}
function wheel(){
  VIEW='wheel';
  render(`${hud()}
  <h2 class="title3d t-l" style="margin-top:4px">GIRA A RODA!</h2>
  <div class="marker" style="text-align:center;font-size:clamp(14px,4.4vw,16px)">e reza pra não cair no Impossível</div>
  <div class="wheelwrap">${wheelSVG()}
  <svg class="pointer" viewBox="0 0 40 46" aria-hidden="true"><path d="M4 3 H36 L20 43 Z" fill="#fff" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/></svg>
  <button class="hub" id="spin">GIRA!</button></div>
  <div style="margin-top:auto">${crewRow()}</div>`);
  const w=document.getElementById('wheel');
  w.style.transition='none';w.style.transform=`rotate(${S.rot}deg)`;
  document.getElementById('spin').onclick=e=>{
    e.currentTarget.disabled=true;
    const all=allQuestions();
    const avail=CATS.filter(c=>all.some(q=>q.cat===c.id&&!S.used.has(q.key)));
    if(!avail.length) return end(false,'Acabaram as perguntas do banco!');
    const fresh=avail.filter(c=>all.some(q=>q.cat===c.id&&!S.used.has(q.key)&&!SEEN[q.key]));
    const bag=avail.concat(fresh,fresh);
    const cat=bag[Math.floor(Math.random()*bag.length)];
    S.rot=Math.ceil(S.rot/360)*360+360*5-ANG[cat.id]+(Math.random()*36-18);
    w.getBoundingClientRect();
    w.style.transition='transform 3.4s cubic-bezier(.12,.75,.18,1)';
    w.style.transform=`rotate(${S.rot}deg)`;
    setTimeout(()=>ask(cat,false),3550);
  };
}

/* ---------- escolher personagem ---------- */
function choose(){
  VIEW='choose';
  const miss=CROWN_CATS.filter(c=>!S.crowns[c]).map(catById);
  render(`${hud()}

/* ---------- pergunta ---------- */
function ask(cat,crown){
  VIEW='ask';
  const q=pickQuestion(cat.id); if(!q) return crown?choose():wheel();
  S.used.add(q.key);S.count++;markSeen(q.key);
  const opts=shuffle([q.c,...q.w]);
  const T=cat.id==='impossivel'?CFG.tempo_impossivel:CFG.tempo;let t=T;
  render(`${hud()}
  ${crown?`<div class="pill bang" style="align-self:center;background:#F5A623;font-size:clamp(16px,5vw,20px);font-weight:400">${CROWN_SVG('#fff')} VALENDO ${esc(cat.m.name).toUpperCase()}</div>`:''}
  <div class="row" style="justify-content:flex-start;gap:12px"><div class="avatar" style="width:54px;height:54px;background:${cat.bg||cat.color}">${mascot(cat.m)}</div>
  <div style="min-width:0"><div class="bang" style="font-size:clamp(22px,7vw,28px);color:${cat.color};-webkit-text-stroke:1px #1a1a1a;line-height:1">${cat.name.toUpperCase()}</div><div class="small">com ${esc(cat.m.name)} · pergunta ${S.count}</div></div>
  <div class="secs bang"><span id="sec">${t}</span></div></div>
  <div class="timer"><i id="bar" style="width:100%"></i></div>
  <div style="position:relative;margin-top:8px"><div class="card qcard" style="padding:16px 16px 18px;border-radius:24px"><div class="marker hide-short" style="color:${cat.id==='impossivel'?'#8E2E43':cat.color};font-size:14px;margin-bottom:6px;-webkit-text-stroke:.3px #1a1a1a">${esc(cat.m.name)} pergunta:</div><div class="qtext" style="font-size:clamp(17px,5.3vw,21px);font-weight:800;line-height:1.28">${esc(q.q)}</div></div><div class="hide-short" style="position:absolute;right:-4px;top:-22px">${BOLT}</div></div>
  <div class="stack opts" style="margin-top:4px" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="let" style="background:${['#F5A623','#E64B55','#18A36A','#3C7DD9'][i]};${i===3?'color:#fff':''}">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`);
  const bar=document.getElementById('bar'),sec=document.getElementById('sec');
  requestAnimationFrame(()=>{bar.style.width=((t-1)/T*100)+'%'});
  S.timer=setInterval(()=>{t--;sec.textContent=t;bar.style.width=(Math.max(t-1,0)/T*100)+'%';if(t<=0){clearInterval(S.timer);answer(null,q,cat,crown,opts)}},1000);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{clearInterval(S.timer);answer(opts[+b.dataset.i],q,cat,crown,opts)});
}

function answer(v,q,cat,crown,opts){
  if(S.answered===q.key) return; S.answered=q.key;
  const ok=v===q.c;
  logVisto(q,ok?'acertou':(v===null?'tempo':'errou'));
  document.querySelectorAll('.opt').forEach(b=>{const val=opts[+b.dataset.i];b.disabled=true;if(val===q.c)b.classList.add('right');else if(val===v)b.classList.add('wrong');else b.classList.add('dim')});
  let gained=null,msg='',full=false;
  if(ok){
    S.streak++;S.right++;
    const pts=(crown?200:cat.id==='impossivel'?250:100)+Math.max(0,S.streak-1)*20;S.score+=pts;msg=`+${pts} PTS`;
    if(crown){S.crowns[cat.id]=true;gained=cat;S.meter=0}
    else{S.meter=(cat.id==='impossivel'&&CFG.impossivel_enche)?CFG.medidor:Math.min(CFG.medidor,S.meter+1);full=S.meter>=CFG.medidor&&CROWN_CATS.some(c=>!S.crowns[c])}
  } else {
    S.streak=0;S.lives--; if(crown) S.meter=0;
    const o=document.getElementById('opts'); if(o) o.classList.add('shake');
  }
  const head = ok ? (gained?'É DA CREW!':cat.id==='impossivel'?'LENDÁRIO!':['PUNCHLINE!','FATALITY!','RIMOU BONITO!'][Math.floor(Math.random()*3)]) : (v===null?'O TEMPO ACABOU!':['ATRAVESSOU O BEAT!','SEM RIMA, PARCEIRO!','FALTOU FLOW!'][Math.floor(Math.random()*3)]);
  setTimeout(()=>feedback(ok,head,msg,q,cat,gained,full,crown),650);
}

function feedback(ok,head,msg,q,cat,gained,full,crown){
  VIEW='feedback';
  const won=CROWN_CATS.every(c=>S.crowns[c]);
  const label = won||S.lives<=0 ? 'VER RESULTADO' : full ? 'ESCOLHER PERSONAGEM' : 'GIRAR DE NOVO';
  render(`${hud()}
  <h2 class="title3d t-m" style="margin-top:10px;${ok?'':'color:#E64B55'};transform:rotate(-3deg)">${head}</h2>
  <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">${ok?`<span class="pill bang" style="background:#18A36A;font-size:20px;font-weight:400">${msg}</span>`:`<span class="pill bang" style="background:#E64B55;font-size:20px;font-weight:400">-1 VIDA</span>`}${gained?`<span class="pill bang" style="background:${gained.color};color:${gained.txt};font-size:20px;font-weight:400">${CROWN_SVG('#F5A623')} ${esc(gained.m.name).toUpperCase()}</span>`:''}${crown&&!ok?`<span class="pill bang" style="font-size:18px;font-weight:400">MEDIDOR ZEROU</span>`:''}</div>
  <div class="card" style="padding:14px 16px"><div class="row" style="justify-content:flex-start;gap:10px"><div class="avatar" style="width:46px;height:46px;background:${cat.bg||cat.color}">${mascot(cat.m)}</div><div style="min-width:0"><div class="small">Resposta certa</div><div class="bang" style="font-size:22px;line-height:1.05">${esc(q.c).toUpperCase()}</div></div></div>
  ${q.ex?`<div style="font-size:15px;line-height:1.45;margin-top:8px;font-weight:500">${esc(q.ex)}</div>`:''}<div class="marker" style="font-size:13px;margin-top:6px">— ${esc(cat.m.name)}</div></div>
  <div>${crewRow()}</div>
  <div style="margin-top:auto"><button class="btn" id="next">${label}</button></div>`);
  document.getElementById('next').onclick=()=>{ if(won||S.lives<=0) return end(won); if(full) return choose(); wheel(); };
}

function end(won,note){
  VIEW='end';
  const rec=S.score>best();if(rec)saveBest(S.score);
  const n=CROWN_CATS.filter(c=>S.crowns[c]).length;

  <div class="card" style="padding:16px">

  <div class="row"><span style="font-weight:700">Acertos</span><span style="font-weight:800">${S.right} de ${S.count}</span></div>
  <div class="row"><span style="font-weight:700">Personagens</span><span style="font-weight:800">${n} de 5</span></div>
  ${rec?'<div class="bang" style="font-size:20px;color:#18A36A;margin-top:6px">NOVO RECORDE!</div>':`<div class="small" style="margin-top:6px">Recorde: ${best()} pts</div>`}</div>
  <div>${crewRow()}</div>

  document.getElementById('home').onclick=home;
}

function readForm(admin){
  const val=id=>document.getElementById(id).value.trim();
  const r={categoria:val('fcat'),pergunta:val('fq'),certa:val('fc'),errada1:val('fw1'),errada2:val('fw2'),errada3:val('fw3'),explicacao:val('fex')};

}

async function criar(){

  const top=`<div class="row"><button class="iconbtn" id="back" aria-label="Voltar">‹</button><span class="pill bang" style="font-size:18px;font-weight:400">NOVA PERGUNTA</span><span style="width:44px"></span></div>

  if(!AUTH.uid){
    render(top+`<div class="card stack" style="padding:16px;text-align:center"><div style="font-weight:600;line-height:1.45">Entra com tua conta Google pra mandar pergunta. Ela passa por aprovação antes de cair no jogo.</div><button class="acct login" id="acct" style="align-self:center">${GOOGLE}<span>Entrar com Google</span></button></div>`);

    err.textContent='';btn.disabled=true;st.textContent='Enviando…';

const REDE={dados:null,tab:'ranking',rank:null,feed:null};
const VULGO_RE=/^[a-z0-9_.]{3,20}$/;
const limpaVulgo=v=>String(v||'').trim().replace(/^@+/,'').toLowerCase();
const erroMsg=e=>{const m=String((e&&e.message)||'');return /[À-ú]|vulgo|amizade|Pedido|Entre/.test(m)&&m.length<90?m:'Deu ruim na conexão. Tenta de novo.'};
function foto(p,size){
  size=size||40;const s=`width:${size}px;height:${size}px;flex:0 0 ${size}px;border-radius:50%;border:2.5px solid #1a1a1a;`;
  if(p&&p.avatar) return `<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer" style="${s}object-fit:cover;background:#fff">`;
  const l=String((p&&(p.vulgo||p.nome))||'?').charAt(0).toUpperCase();

function quando(t){
  const d=(Date.now()-Date.parse(t))/1000;if(!(d>=0))return '';
  if(d<60)return 'agora';if(d<3600)return `há ${Math.floor(d/60)} min`;if(d<86400)return `há ${Math.floor(d/3600)} h`;
  if(d<86400*7){const n=Math.floor(d/86400);return `há ${n} dia${n>1?'s':''}`}
  return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
}

async function comunidade(tab){
  VIEW='comunidade'; if(tab) REDE.tab=tab;
  const top=`<div class="row"><button class="iconbtn" id="back" aria-label="Voltar">‹</button><span class="pill bang" style="font-size:18px;font-weight:400">COMUNIDADE</span><span style="width:44px"></span></div>`;
  const voltar=()=>{document.getElementById('back').onclick=home};
  if(!sb){render(top+`<div class="card" style="padding:16px">O jogo ainda não está ligado no banco.</div>`);voltar();return}
  if(!AUTH.uid){
    render(top+`<h2 class="title3d t-l" style="margin-top:4px">TEUS<br>PARÇAS</h2><div class="card stack" style="padding:16px;text-align:center"><div style="font-weight:600;line-height:1.45">Entra com tua conta Google, cria teu vulgo e adiciona os parça pra ver quem tá mandando na roda.</div><button class="acct login" id="acct" style="align-self:center">${GOOGLE}<span>Entrar com Google</span></button></div>`);
    bindAcct();voltar();return;
  }
  if(!REDE.dados){render(top+`<div class="small" style="text-align:center;margin-top:30px">Carregando…</div>`);voltar();await carregarRede();if(VIEW!=='comunidade')return}
  const R=REDE.dados||{eu:{},recebidos:[],enviados:[],amigos:[]};
  if(!R.eu||!R.eu.vulgo) return escolherVulgo(top);
  const tabs=[['ranking','Ranking'],['atividade','Atividade'],['parcas',`Parças${R.amigos.length?` (${R.amigos.length})`:''}`]];
  render(top+`
  <div class="card" style="padding:12px 14px"><div class="row" style="gap:10px;justify-content:flex-start">${foto(R.eu,44)}
    <div style="flex:1;min-width:0"><div class="small" style="margin:0">teu vulgo</div><div class="bang" style="font-size:24px;line-height:1.05;overflow:hidden;text-overflow:ellipsis">@${esc(R.eu.vulgo)}</div></div>
    <button class="mini" id="trocar">trocar</button></div>
    <form id="add" style="display:flex;gap:8px;margin-top:10px"><div class="fl" style="flex:1;min-width:0"><input id="addv" placeholder="@vulgo" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="21" aria-label="Vulgo do parça"></div><button class="btn sm" id="addb" style="width:auto;padding:0 14px;min-height:46px;background:#18A36A">ADICIONAR</button></form>
    <div id="addmsg" class="small" style="min-height:0;margin-top:6px;font-weight:700"></div></div>
  ${R.recebidos.length?`<div class="card stack" style="padding:12px 14px;background:#FFF4DC"><div class="bang" style="font-size:20px">QUEREM COLAR CONTIGO</div>${R.recebidos.map(p=>`<div class="row" style="gap:8px 10px;justify-content:flex-start;flex-wrap:wrap">${foto(p,38)}<div style="flex:1 1 110px;min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis">@${esc(p.vulgo)}</div><div class="small" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nome||'')}</div></div><span style="display:flex;gap:8px;margin-left:auto"><button class="mini g" data-ok="${p.id}">Aceitar</button><button class="mini r" data-no="${p.id}">Recusar</button></span></div>`).join('')}</div>`:''}
  <div class="tabs" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">${tabs.map(([k,l])=>`<button class="tab ${REDE.tab===k?'on':''}" style="padding:7px 4px;font-size:clamp(12.5px,3.9vw,14px)" data-ct="${k}">${l}</button>`).join('')}</div>
  <div id="rede" class="stack"><div class="small">Carregando…</div></div>`);
  voltar();
  document.getElementById('trocar').onclick=()=>escolherVulgo(top,R.eu.vulgo);
  document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>comunidade(b.dataset.ct));
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;const id=+(b.dataset.ok||b.dataset.no);
    const {error}=await sb.rpc('responder_amizade',{pedido:id,aceitar:!!b.dataset.ok});
    if(error){b.disabled=false;return}
    REDE.rank=REDE.feed=null;await carregarRede();comunidade();
  });
  document.getElementById('add').onsubmit=async e=>{
    e.preventDefault();const msg=document.getElementById('addmsg'),btn=document.getElementById('addb');
    const v=limpaVulgo(document.getElementById('addv').value);
    msg.style.color='#8a1c25';
    if(!v){msg.textContent='Digita o vulgo do parça.';return}
    if(v===R.eu.vulgo){msg.textContent='Esse vulgo é o teu.';return}
    btn.disabled=true;msg.style.color='#555';msg.textContent='Procurando…';
    const {data,error}=await sb.rpc('pedir_amizade',{alvo:v});btn.disabled=false;
    if(error){msg.style.color='#8a1c25';msg.textContent=erroMsg(error);return}
    const txt={enviado:`Pedido enviado pra @${v}. Quando aceitar, aparece aqui.`,aceita:`Fechou! Tu e @${v} agora são parças.`,ja_amigos:`Tu e @${v} já são parças.`,ja_pedido:`Já tem pedido pendente com @${v}.`}[data]||'Feito.';
    if(data==='aceita'){REDE.rank=REDE.feed=null;await carregarRede();REDE.tab='ranking';comunidade();setTimeout(()=>{const m=document.getElementById('addmsg');if(m){m.style.color='#0f6b45';m.textContent=txt}},0);return}
    msg.style.color=data==='enviado'?'#0f6b45':'#555';msg.textContent=txt;document.getElementById('addv').value='';
    if(data==='enviado'){await carregarRede();if(REDE.tab==='parcas'&&VIEW==='comunidade')redeParcas()}
  };
  ({ranking:redeRanking,atividade:redeAtividade,parcas:redeParcas})[REDE.tab]();
}

function escolherVulgo(top,atual){
  render(top+`<h2 class="title3d t-l" style="margin-top:4px">${atual?'TROCA TEU':'ESCOLHE TEU'}<br>VULGO</h2>
  <div class="card stack" style="padding:16px"><div style="font-weight:600;line-height:1.45">É por ele que os parça te acham na roda. Letras minúsculas, números, ponto ou _ (3 a 20).</div>
  <form id="vf" class="stack"><div class="fl"><div style="display:flex;align-items:center;gap:6px"><span class="bang" style="font-size:28px">@</span><input id="vi" value="${esc(atual||'')}" placeholder="teu_vulgo" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="21" aria-label="Vulgo"></div></div>
  <div id="verr" class="small" style="color:#8a1c25;font-weight:700;min-height:0"></div>
  <button class="btn sm" id="vsalvar" style="background:#18A36A">SALVAR VULGO</button>${atual?`<button type="button" class="btn sm" id="vcanc" style="background:#fff">CANCELAR</button>`:''}</form></div>`);
  document.getElementById('back').onclick=atual?()=>comunidade():home;
  const c=document.getElementById('vcanc');if(c)c.onclick=()=>comunidade();
  const inp=document.getElementById('vi');
  inp.oninput=()=>{const p=inp.selectionStart;const v=inp.value.replace(/^@+/,'').toLowerCase().replace(/\s/g,'_');if(v!==inp.value){inp.value=v;try{inp.setSelectionRange(p,p)}catch(e){}}};
  document.getElementById('vf').onsubmit=async e=>{
    e.preventDefault();const err=document.getElementById('verr'),b=document.getElementById('vsalvar');
    const v=limpaVulgo(inp.value);
    if(!VULGO_RE.test(v)){err.textContent='Use de 3 a 20 letras minúsculas, números, ponto ou _';return}
    if(v===atual) return comunidade();
    b.disabled=true;err.textContent='';
    const {error}=await sb.rpc('definir_vulgo',{novo:v});b.disabled=false;
    if(error){err.textContent=erroMsg(error);return}
    if(REDE.dados&&REDE.dados.eu)REDE.dados.eu.vulgo=v;if(AUTH.perfil)AUTH.perfil.vulgo=v;
    REDE.rank=REDE.feed=null;await carregarRede();comunidade();
  };
}
const redeBox=()=>document.getElementById('rede');
const vazioRede=t=>`<div class="card" style="padding:16px;text-align:center;font-weight:600;line-height:1.45">${t}</div>`;
async function redeRanking(){
  if(!REDE.rank){const {data}=await sb.rpc('ranking_amigos');REDE.rank=data||[]}
  const b=redeBox();if(!b||REDE.tab!=='ranking')return;
  const L=REDE.rank;
  if(L.length<2){b.innerHTML=vazioRede('Ainda tá só tu na roda. Adiciona os parça pelo vulgo e vê quem manda.')+(L[0]?rankCard(L[0],1):'');return}
  b.innerHTML=L.map((r,i)=>rankCard(r,i+1)).join('');
}
function rankCard(r,pos){
  const med=['#F5A623','#C9CED6','#D9A066'][pos-1];
  return `<div class="card" style="padding:10px 12px;border-radius:16px;box-shadow:4px 4px 0 #1a1a1a;${r.eu?'background:#FFF4DC;':''}">
  <div class="row" style="gap:10px;justify-content:flex-start">
  <span class="bang" style="width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:2.5px solid #1a1a1a;display:inline-flex;align-items:center;justify-content:center;font-size:18px;background:${med||'#fff'}">${pos}</span>
  ${foto(r,38)}
  <div style="flex:1;min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">@${esc(r.vulgo||'')}${r.eu?' <span class="tag" style="background:#1a1a1a;color:#fff;font-size:11px">você</span>':''}</div>
  <div class="small" style="margin:0;font-size:12px;line-height:1.3">${r.vitorias} vitória${r.vitorias==1?'':'s'} · ${r.partidas} partida${r.partidas==1?'':'s'} · ${r.acerto}% acerto</div></div>
  <div style="text-align:right"><div class="bang" style="font-size:22px;line-height:1">${r.recorde}</div><div class="small" style="margin:0;font-size:11px">recorde</div></div></div></div>`;
}
async function redeAtividade(){
  if(!REDE.feed){const {data}=await sb.rpc('atividade_amigos');REDE.feed=data||[]}
  const b=redeBox();if(!b||REDE.tab!=='atividade')return;
  if(!REDE.feed.length){b.innerHTML=vazioRede((REDE.dados.amigos||[]).length?'Os parça ainda não jogaram. Quando rolar partida, aparece aqui.':'Adiciona os parça pelo vulgo pra acompanhar o que eles andam fazendo na roda.');return}
  b.innerHTML=REDE.feed.map(a=>`<div class="card" style="padding:10px 12px;border-radius:16px;box-shadow:3px 3px 0 #1a1a1a;${a.destaque?'background:#FFF4DC;':''}">
  <div class="row" style="gap:10px;justify-content:flex-start;align-items:flex-start">${foto(a,36)}
  <div style="flex:1;min-width:0;line-height:1.35"><b>@${esc(a.vulgo||'')}</b> ${esc(a.texto)}${a.destaque?' '+CROWN_SVG('#F5A623'):''}
  <div class="small" style="margin:2px 0 0">${a.pontos!=null?`${a.pontos} pts · `:''}${quando(a.quando)}</div></div></div></div>`).join('');
}
function redeParcas(){
  const b=redeBox();if(!b||REDE.tab!=='parcas')return;
  const R=REDE.dados;
  const linha=(p,btn)=>`<div class="card" style="padding:10px 12px;border-radius:16px;box-shadow:3px 3px 0 #1a1a1a"><div class="row" style="gap:10px;justify-content:flex-start">${foto(p,38)}<div style="flex:1;min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">@${esc(p.vulgo)}</div><div class="small" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nome||'')}</div></div>${btn}</div></div>`;
  b.innerHTML=(R.amigos.length?R.amigos.map(p=>linha(p,`<button class="mini" data-rm="${p.id}">Desfazer</button>`)).join(''):vazioRede('Nenhum parça ainda. Manda o vulgo deles ali em cima.'))
   +(R.enviados.length?`<div class="bang" style="font-size:20px;margin-top:6px">ESPERANDO RESPOSTA</div>`+R.enviados.map(p=>linha(p,`<button class="mini" data-rm="${p.id}">Cancelar</button>`)).join(''):'');
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=async()=>{
    if(!x.dataset.arm){x.dataset.arm='1';x.textContent='Certeza?';x.classList.add('r');return}
    x.disabled=true;const {error}=await sb.from('amizades').delete().eq('id',+x.dataset.rm);
    if(error){x.disabled=false;return}
    REDE.rank=REDE.feed=null;await carregarRede();if(VIEW==='comunidade')comunidade();
  });
}

const ADM={tab:'aprovar',lista:null,filtro:{busca:'',cat:'',status:''}};
function admin(tab){
  if(!isAdmin()) return home();
  VIEW='admin'; ADM.tab=tab||ADM.tab;
  const tabs=[['aprovar','Aprovar'+(PEND?` (${PEND})`:'')],['perguntas','Perguntas'],['numeros','Números'],['ajustes','Ajustes'],['equipe','Equipe']];
  render(`<div class="row"><button class="iconbtn" id="back" aria-label="Voltar">‹</button><span class="pill bang" style="font-size:18px;font-weight:400">PAINEL ADMIN</span><span style="width:44px"></span></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${ADM.tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>
  <div id="adm" class="stack"><div class="small">Carregando…</div></div>`,true);
  document.getElementById('back').onclick=()=>{carregarPerguntas();home()};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>admin(b.dataset.t));
  ({aprovar:admAprovar,perguntas:admPerguntas,numeros:admNumeros,ajustes:admAjustes,equipe:admEquipe})[ADM.tab]();
}
const box=()=>document.getElementById('adm');
function qCard(r,acts){
  const c=catById(r.categoria)||CATS[0];
  return `<div class="card" style="padding:12px 14px;border-radius:16px;box-shadow:4px 4px 0 #1a1a1a" data-id="${r.id}">
  <div class="row"><span class="tag" style="background:${c.color};color:${c.txt}">${esc(c.name)}</span><span style="display:flex;gap:6px"><span class="tag" style="background:${STATUS_COR[r.status]}">${r.status}</span>${r.ativa?'':'<span class="tag" style="background:#ddd">inativa</span>'}</span></div>
  <div style="font-weight:800;margin-top:8px;line-height:1.3">${esc(r.pergunta)}</div>
  <div style="font-size:14px;margin-top:6px;line-height:1.5"><span style="color:#0f6b45;font-weight:800">✔ ${esc(r.certa)}</span><br><span style="color:#8a1c25">✘ ${esc(r.errada1)} · ${esc(r.errada2)} · ${esc(r.errada3)}</span></div>
  ${r.explicacao?`<div class="small" style="font-weight:500;margin-top:6px">${esc(r.explicacao)}</div>`:''}
  <div class="small" style="margin-top:6px;color:#555">${r.origem==='oficial'?'Oficial':'por '+esc(r.autor_nome||'jogador')} · ${new Date(r.criada_em).toLocaleDateString('pt-BR')}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${acts}</div></div>`;
}
const SEL='id,categoria,pergunta,certa,errada1,errada2,errada3,explicacao,status,ativa,origem,autor_nome,criada_em';

async function admAprovar(){
  const {data,error}=await sb.from('perguntas').select(SEL).eq('status','pendente').order('criada_em',{ascending:true}).limit(200);
  if(!box()) return;
  if(error){box().innerHTML='<div class="card" style="padding:16px">Não deu pra carregar.</div>';return}
  PEND=data.length;
  box().innerHTML=data.length?data.map(r=>qCard(r,`<button class="mini g" data-ap="${r.id}">Aprovar</button><button class="mini" data-ed="${r.id}">Editar</button><button class="mini r" data-rc="${r.id}">Recusar</button>`)).join(''):'<div class="card" style="padding:18px;text-align:center"><div class="bang" style="font-size:24px">TUDO LIMPO</div><div style="font-weight:500">Nenhuma pergunta esperando aprovação.</div></div>';
  const byId=id=>data.find(x=>x.id===id);
  box().querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>mudarStatus(b.dataset.ap,'aprovada',b));
  box().querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Confirmar';return}mudarStatus(b.dataset.rc,'recusada',b)});
  box().querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editar(byId(b.dataset.ed),'aprovar'));
}
async function mudarStatus(id,status,btn){
  btn.disabled=true;
  const {error}=await sb.from('perguntas').update({status}).eq('id',id);
  if(error){btn.disabled=false;btn.textContent='Erro, tenta de novo';return}
  const card=btn.closest('[data-id]'); if(card) card.remove();
  PEND=Math.max(0,PEND-1);
  const t=document.querySelector('[data-t="aprovar"]'); if(t) t.textContent='Aprovar'+(PEND?` (${PEND})`:'');
  if(box()&&!box().querySelector('[data-id]')) admAprovar();
}

async function admPerguntas(){
  if(!ADM.lista){
    const {data}=await sb.from('perguntas').select(SEL).order('criada_em',{ascending:false}).limit(3000);
    ADM.lista=data||[];
  }
  if(!box()) return;
  const f=ADM.filtro;
  box().innerHTML=`<div class="card" style="padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
  <label class="fl" style="grid-column:1/-1">Buscar<input id="fb" value="${esc(f.busca)}" placeholder="Palavra da pergunta ou resposta"></label>
  <label class="fl">Categoria<select id="fcat2"><option value="">Todas</option>${CATS.map(c=>`<option value="${c.id}" ${f.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label class="fl">Status<select id="fst2"><option value="">Todos</option>${['aprovada','pendente','recusada'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn sm" id="nova" style="background:#18A36A">+ NOVA</button><button class="btn sm" id="csv" style="background:#fff">BAIXAR CSV</button></div>
  <div class="small" id="cont"></div><div class="stack" id="lst"></div>`;
  const draw=()=>{
    const b=norm(f.busca);
    const rows=ADM.lista.filter(r=>(!f.cat||r.categoria===f.cat)&&(!f.status||r.status===f.status)&&(!b||norm([r.pergunta,r.certa,r.errada1,r.errada2,r.errada3,r.explicacao,r.autor_nome].join(' ')).includes(b)));
    document.getElementById('cont').textContent=`${rows.length} pergunta${rows.length===1?'':'s'}`;
    const shown=rows.slice(0,150);
    document.getElementById('lst').innerHTML=shown.map(r=>qCard(r,`<button class="mini" data-ed="${r.id}">Editar</button><button class="mini ${r.ativa?'':'g'}" data-at="${r.id}">${r.ativa?'Desativar':'Ativar'}</button><button class="mini r" data-rm="${r.id}">Apagar</button>`)).join('')+(rows.length>150?'<div class="small">Mostrando 150. Use a busca pra achar as outras.</div>':'');
    const byId=id=>ADM.lista.find(x=>x.id===id);
    document.querySelectorAll('#lst [data-ed]').forEach(x=>x.onclick=()=>editar(byId(x.dataset.ed),'perguntas'));
    document.querySelectorAll('#lst [data-at]').forEach(x=>x.onclick=async()=>{const r=byId(x.dataset.at);x.disabled=true;const {error}=await sb.from('perguntas').update({ativa:!r.ativa}).eq('id',r.id);if(!error)r.ativa=!r.ativa;draw()});
    document.querySelectorAll('#lst [data-rm]').forEach(x=>x.onclick=async()=>{if(x.dataset.arm!=='1'){x.dataset.arm='1';x.textContent='Confirmar';return}x.disabled=true;const {error}=await sb.from('perguntas').delete().eq('id',x.dataset.rm);if(!error)ADM.lista=ADM.lista.filter(r=>r.id!==x.dataset.rm);draw()});
  };
  document.getElementById('fb').oninput=e=>{f.busca=e.target.value;draw()};
  document.getElementById('fcat2').onchange=e=>{f.cat=e.target.value;draw()};
  document.getElementById('fst2').onchange=e=>{f.status=e.target.value;draw()};
  document.getElementById('nova').onclick=()=>editar(null,'perguntas');
  document.getElementById('csv').onclick=()=>baixarCSV(ADM.lista);
  draw();
}
function editar(r,back){
  VIEW='admin-edit';
  const p=r?{cat:r.categoria,q:r.pergunta,c:r.certa,w:[r.errada1,r.errada2,r.errada3],ex:r.explicacao,status:r.status,ativa:r.ativa}:{cat:ADM.filtro.cat||'mcs',status:'aprovada',ativa:true};
  render(`<div class="row"><button class="iconbtn" id="back" aria-label="Voltar">‹</button><span class="pill bang" style="font-size:18px;font-weight:400">${r?'EDITAR':'NOVA'} PERGUNTA</span><span style="width:44px"></span></div>
  ${r&&r.origem==='galera'?`<div class="small" style="text-align:center">Enviada por ${esc(r.autor_nome||'jogador')}</div>`:''}${formHTML(p,true)}`,true);
  document.getElementById('back').onclick=()=>admin(back);
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const {r:row,erro}=readForm(true);const err=document.getElementById('ferr'),btn=document.getElementById('salvar');
    if(erro){err.textContent=erro;return}
    btn.disabled=true;
    let res;
    if(r) res=await sb.from('perguntas').update(row).eq('id',r.id);
    else res=await sb.from('perguntas').insert({...row,origem:'oficial',autor_id:AUTH.uid,autor_nome:(AUTH.perfil||{}).nome||null});
    btn.disabled=false;
    if(res.error){err.textContent='Não deu pra salvar: '+(res.error.message||'erro');return}
    ADM.lista=null; carregarPerguntas(); contarPendentes(); admin(back);
  };
}
function baixarCSV(rows){
  const cell=v=>{v=String(v??'');return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['id','status','ativa','origem','autor','categoria','pergunta','certa','errada1','errada2','errada3','explicacao','criada_em'];
  const csv='﻿'+[head,...rows.map(r=>[r.id,r.status,r.ativa?'SIM':'NÃO',r.origem,r.autor_nome||'',(catById(r.categoria)||{}).name,r.pergunta,r.certa,r.errada1,r.errada2,r.errada3,r.explicacao,r.criada_em])].map(r=>r.map(cell).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='roda-da-rima-perguntas.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

async function admNumeros(){
  const {data,error}=await sb.rpc('painel_stats');
  if(!box()) return;
  if(error||!data){box().innerHTML='<div class="card" style="padding:16px">Não deu pra carregar os números.</div>';return}
  const d=data;
  const stat=(l,v)=>`<div class="stat"><b>${v}</b><span class="small">${l}</span></div>`;
  const cats=(d.por_categoria||[]).map(x=>{const c=catById(x.categoria)||{name:x.categoria,color:'#ddd',txt:'#1a1a1a'};const pct=x.respondidas?Math.round(100*x.acertos/x.respondidas):0;
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid #ddd"><span class="tag" style="background:${c.color};color:${c.txt}">${esc(c.name)}</span><span class="small">${x.ativas} ativas · ${x.respondidas} respostas · ${pct}% acerto</span></div>`}).join('');
  const piores=(d.mais_erradas||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #ddd"><div style="font-weight:700;line-height:1.3">${esc(x.pergunta)}</div><div class="small">${x.pct}% de acerto em ${x.respostas} respostas</div></div>`).join('')||'<div class="small">Precisa de pelo menos 5 respostas por pergunta.</div>';
  box().innerHTML=`<div class="grid2">${stat('partidas',d.partidas)}${stat('jogadores que jogaram',d.jogadores)}${stat('contas criadas',d.cadastrados)}${stat('vitórias',d.vitorias)}${stat('maior pontuação',d.maior)}${stat('média de pontos',d.media)}</div>
  <div class="card" style="padding:12px 14px"><div class="bang" style="font-size:20px">POR CATEGORIA</div>${cats}</div>
  <div class="card" style="padding:12px 14px"><div class="bang" style="font-size:20px">AS QUE MAIS DERRUBAM</div>${piores}</div>`;
}

async function admAjustes(){
  await carregarConfig();
  if(!box()) return;
  const n=(id,l,v,min,max,h)=>`<label class="fl">${l}<input id="${id}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${v}"><span class="small" style="font-weight:500">${h}</span></label>`;
  box().innerHTML=`<form id="cf" class="card stack" style="padding:16px" novalidate>
  ${n('cv','Vidas',CFG.vidas,1,10,'Quantos erros o jogador aguenta.')}
  ${n('ct','Tempo por pergunta (segundos)',CFG.tempo,5,120,'')}
  ${n('cti','Tempo no Impossível (segundos)',CFG.tempo_impossivel,5,120,'')}
  ${n('cm','Acertos pra encher o medidor',CFG.medidor,1,10,'Quando enche, o jogador escolhe um personagem.')}
  <label class="check"><input type="checkbox" id="ci" ${CFG.impossivel_enche?'checked':''}> Acertar o Impossível enche o medidor na hora</label>
  <div id="cerr" class="small" style="color:#B3261E"></div>
  <button class="btn" type="submit" id="csalvar" style="background:#18A36A">SALVAR AJUSTES</button><div id="cok" class="small" style="text-align:center"></div></form>`;
  document.getElementById('cf').onsubmit=async e=>{
    e.preventDefault();
    const g=id=>parseInt(document.getElementById(id).value,10);
    const row={vidas:g('cv'),tempo:g('ct'),tempo_impossivel:g('cti'),medidor:g('cm'),impossivel_enche:document.getElementById('ci').checked,atualizado_em:new Date().toISOString()};
    const bad=[[row.vidas,1,10],[row.tempo,5,120],[row.tempo_impossivel,5,120],[row.medidor,1,10]].some(([v,a,b])=>!(v>=a&&v<=b));
    if(bad){document.getElementById('cerr').textContent='Algum valor está fora do limite.';return}
    document.getElementById('cerr').textContent='';
    const {error}=await sb.from('config').update(row).eq('id',1);
    if(error){document.getElementById('cerr').textContent='Não deu pra salvar.';return}
    CFG={...CFG,...row};document.getElementById('cok').innerHTML='<b style="color:#0f6b45">Salvo!</b> Vale na próxima partida de todo mundo.';
  };
}

async function admEquipe(){
  const {data}=await sb.from('perfis').select('id,nome,avatar,papel,criado_em').order('criado_em',{ascending:false}).limit(500);
  if(!box()) return;
  const rows=data||[];
  box().innerHTML=`<label class="fl">Buscar pessoa<input id="eb" placeholder="Nome"></label><div class="small" id="ec"></div><div class="stack" id="el"></div>`;
  const draw=q=>{
    const b=norm(q);const list=rows.filter(r=>!b||norm(r.nome).includes(b)).sort((a,b)=>(a.papel==='admin'?-1:0)-(b.papel==='admin'?-1:0));
    document.getElementById('ec').textContent=`${rows.length} conta${rows.length===1?'':'s'} · ${rows.filter(r=>r.papel==='admin').length} admin`;
    document.getElementById('el').innerHTML=list.slice(0,100).map(r=>`<div class="card row" style="padding:10px 12px;border-radius:14px;box-shadow:3px 3px 0 #1a1a1a"><span style="display:flex;align-items:center;gap:10px;min-width:0">${r.avatar?`<img src="${esc(r.avatar)}" alt="" referrerpolicy="no-referrer" style="width:36px;height:36px;border-radius:50%;border:2px solid #1a1a1a;flex:0 0 36px">`:''}<span style="min-width:0"><span style="font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.nome||'Sem nome')}</span><span class="small">${r.papel}</span></span></span>${r.id===AUTH.uid?'<span class="small">você</span>':`<button class="mini ${r.papel==='admin'?'r':'g'}" data-pp="${r.id}">${r.papel==='admin'?'Tirar admin':'Tornar admin'}</button>`}</div>`).join('');
    document.querySelectorAll('[data-pp]').forEach(x=>x.onclick=async()=>{
      if(x.dataset.arm!=='1'){x.dataset.arm='1';x.textContent='Confirmar';return}
      const r=rows.find(y=>y.id===x.dataset.pp);const novo=r.papel==='admin'?'jogador':'admin';x.disabled=true;
      const {error}=await sb.from('perfis').update({papel:novo}).eq('id',r.id);if(!error)r.papel=novo;draw(document.getElementById('eb').value);
    });
  };
  document.getElementById('eb').oninput=e=>draw(e.target.value);
  draw('');
}

/* ---------- início ---------- */
(async function boot(){
  newGame(); home();
  if(!sb) return;
  try{
    const {data}=await sb.auth.getSession();
    await setSession(data.session);
    if(location.hash.includes('access_token')||location.search.includes('code=')) history.replaceState(null,'',location.pathname);
  }catch(e){}
  sb.auth.onAuthStateChange((_ev,s)=>{setTimeout(()=>setSession(s),0)});
  await Promise.all([carregarConfig(),carregarPerguntas()]);
  if(VIEW==='home') home();
})();
